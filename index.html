<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Skill & AI Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }

    /* Panel Kiri: Pengelola Skill */
    .sidebar { width: 340px; background-color: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 16px; }
    .sidebar h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .btn-create { background: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 16px; transition: 0.2s; }
    .btn-create:hover { background: #0369a1; }
    
    .skill-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .skill-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; position: relative; }
    .skill-card:hover { border-color: #38bdf8; }
    .skill-card.active { border-color: #38bdf8; background: #1e3a5f; }
    .skill-card h4 { font-size: 14px; margin-bottom: 4px; color: #f1f5f9; }
    .skill-card p { font-size: 12px; color: #94a3b8; line-height: 1.3; }
    .skill-card .delete-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; }

    /* Area Utama: Percakapan */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    .header-bar { padding: 14px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; background: #1e293b; }
    .active-badge { font-size: 13px; background: #0369a1; padding: 4px 10px; border-radius: 12px; font-weight: 500; }
    .api-key-input { background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 6px 10px; border-radius: 4px; font-size: 12px; width: 220px; }

    .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: #0284c7; color: white; }
    .msg.bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; color: #e2e8f0; }

    .input-bar { padding: 16px 20px; border-top: 1px solid #334155; display: flex; gap: 10px; background: #1e293b; }
    .input-bar textarea { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 6px; resize: none; height: 50px; font-size: 14px; }
    .btn-send { background: #38bdf8; color: #0f172a; border: none; padding: 0 20px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-send:hover { background: #7dd3fc; }

    /* Modal Pembuat Skill */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal { background: #1e293b; width: 480px; padding: 20px; border-radius: 8px; border: 1px solid #475569; }
    .modal h3 { margin-bottom: 14px; color: #38bdf8; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
    .form-group input, .form-group textarea { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px; border-radius: 4px; font-size: 13px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-cancel { background: #475569; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Sidebar: Kelola Skill -->
  <div class="sidebar">
    <h2>📁 Koleksi Skill Anda</h2>
    <button class="btn-create" onclick="openModal()">+ Buat Skill Baru</button>
    <div class="skill-list" id="skillListContainer"></div>
  </div>

  <!-- Area Chat & Testing -->
  <div class="main-chat">
    <div class="header-bar">
      <div>
        <span>Skill Aktif: </span>
        <span class="active-badge" id="activeSkillLabel">Default (Asisten Standar)</span>
      </div>
      <div>
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="Masukkan Gemini API Key..." title="Kunci tersimpan aman di browser Anda">
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Halo! Pilih atau buat skill di sebelah kiri, lalu mulailah berinteraksi. AI akan langsung bekerja sesuai rute dan aturan dari skill yang aktif.</div>
    </div>

    <div class="input-bar">
      <textarea id="promptInput" placeholder="Ketik perintah atau tugas Anda di sini... (Tekan Shift+Enter untuk baris baru)"></textarea>
      <button class="btn-send" onclick="handleSend()">Kirim</button>
    </div>
  </div>

  <!-- Modal Dialog: Pembuat Rute/Skill -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>Buat Panduan / Skill Baru</h3>
      <div class="form-group">
        <label>Nama Skill:</label>
        <input type="text" id="skillName" placeholder="Contoh: Editor Teks Promo">
      </div>
      <div class="form-group">
        <label>Peran AI (Role):</label>
        <input type="text" id="skillRole" placeholder="Contoh: Spesialis copywriting iklan lokal">
      </div>
      <div class="form-group">
        <label>Gaya Bahasa & Tone:</label>
        <input type="text" id="skillTone" placeholder="Contoh: Santai, persuasif, bahasa Indonesia ringkas">
      </div>
      <div class="form-group">
        <label>Instruksi Rute & Batasan Kerja:</label>
        <textarea id="skillInstructions" rows="4" placeholder="Contoh: 1. Jangan gunakan kata teknis. 2. Berikan 3 variasi judul. 3. Sertakan call to action singkat."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-create" style="margin-bottom: 0;" onclick="saveSkill()">Simpan Skill</button>
      </div>
    </div>
  </div>

  <script>
    // State Aplikasi
    let skills = JSON.parse(localStorage.getItem('user_skills')) || [
      {
        id: 'default',
        name: 'Asisten Standar',
        role: 'Asisten Umum',
        tone: 'Membantu, ramah, dan ringkas',
        instructions: 'Bantu jawab setiap pertanyaan dengan jelas dan akurat.'
      }
    ];
    let activeSkillId = localStorage.getItem('active_skill_id') || 'default';

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      renderSkills();
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;

      document.getElementById('apiKeyInput').addEventListener('input', (e) => {
        localStorage.setItem('gemini_api_key', e.target.value.trim());
      });

      document.getElementById('promptInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
    });

    // Render Kartu Skill
    function renderSkills() {
      const container = document.getElementById('skillListContainer');
      container.innerHTML = '';

      skills.forEach(skill => {
        const card = document.createElement('div');
        card.className = `skill-card ${skill.id === activeSkillId ? 'active' : ''}`;
        card.onclick = () => selectSkill(skill.id);

        card.innerHTML = `
          <h4>${skill.name}</h4>
          <p>${skill.role} &bull; <i>${skill.tone}</i></p>
          ${skill.id !== 'default' ? `<button class="delete-btn" onclick="deleteSkill(event, '${skill.id}')">Hapus</button>` : ''}
        `;
        container.appendChild(card);
      });

      const active = skills.find(s => s.id === activeSkillId) || skills[0];
      document.getElementById('activeSkillLabel').innerText = active.name;
    }

    function selectSkill(id) {
      activeSkillId = id;
      localStorage.setItem('active_skill_id', id);
      renderSkills();
      appendMessage('bot', `💡 Berpindah ke skill: **${skills.find(s => s.id === id).name}**.\nAI sekarang siap bekerja sesuai rute panduan ini.`);
    }

    function deleteSkill(event, id) {
      event.stopPropagation();
      skills = skills.filter(s => s.id !== id);
      localStorage.setItem('user_skills', JSON.stringify(skills));
      if (activeSkillId === id) activeSkillId = 'default';
      renderSkills();
    }

    // Modal Form
    function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    function saveSkill() {
      const name = document.getElementById('skillName').value.trim();
      const role = document.getElementById('skillRole').value.trim();
      const tone = document.getElementById('skillTone').value.trim();
      const instructions = document.getElementById('skillInstructions').value.trim();

      if (!name) return alert('Nama skill wajib diisi!');

      const newSkill = {
        id: 'skill_' + Date.now(),
        name,
        role: role || 'Asisten Khusus',
        tone: tone || 'Informatif',
        instructions: instructions || 'Jalankan tugas sesuai permintaan pengguna.'
      };

      skills.push(newSkill);
      localStorage.setItem('user_skills', JSON.stringify(skills));
      
      // Bersihkan form
      document.getElementById('skillName').value = '';
      document.getElementById('skillRole').value = '';
      document.getElementById('skillTone').value = '';
      document.getElementById('skillInstructions').value = '';
      
      closeModal();
      selectSkill(newSkill.id);
    }

    // Eksekusi Panggilan API ke Mesin LLM (Gemini)
    async function handleSend() {
      const promptInput = document.getElementById('promptInput');
      const text = promptInput.value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim();

      if (!text) return;
      if (!apiKey) return alert('Silakan masukkan Gemini API Key di pojok kanan atas terlebih dahulu!');

      appendMessage('user', text);
      promptInput.value = '';

      const activeSkill = skills.find(s => s.id === activeSkillId) || skills[0];

      // Struktur System Instruction (Catatan Rute)
      const systemInstruction = `
Kamu adalah modul AI yang telah diprogram dengan SKILL khusus:
- PERAN: ${activeSkill.role}
- GAYA/NADA BAHASA: ${activeSkill.tone}
- ATURAN & RUTE KERJA:
${activeSkill.instructions}

Patuhi seluruh aturan kerja di atas dalam menjawab permintaan pengguna berikut.
      `.trim();

      const loadingMsg = appendMessage('bot', 'Mengetik...');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                role: 'user',
                parts: [
                  { text: `${systemInstruction}\n\nPermintaan Pengguna:\n${text}` }
                ]
              }
            ]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'Terjadi kesalahan pada API');

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Tidak ada balasan dari model.';
        loadingMsg.innerText = reply;
      } catch (err) {
        loadingMsg.innerText = 'Gagal memproses: ' + err.message;
        loadingMsg.style.color = '#ef4444';
      }
    }

    function appendMessage(sender, text) {
      const chatBox = document.getElementById('chatBox');
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
</html>
