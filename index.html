<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Studio Skill & AI Agent</title>
  <style>
    :root {
      --bg-main: #0b1121; --bg-panel: #161e31; --bg-card: #1f2940;
      --primary: #3b82f6; --primary-hover: #2563eb;
      --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
      --danger: #ef4444; --bot-msg: #1e293b; --user-msg: linear-gradient(135deg, #2563eb, #3b82f6);
      --agent-action: #047857; /* Warna hijau untuk aksi agent */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100dvh; display: flex; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    
    .app-container { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 320px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    .sidebar-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; }
    .sidebar h2 { font-size: 16px; color: var(--text-main); }
    .btn-create { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .skill-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .skill-card { background: var(--bg-card); border: 1px solid var(--border); padding: 16px; border-radius: 12px; cursor: pointer; position: relative; }
    .skill-card.active { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
    .skill-card h4 { font-size: 15px; margin-bottom: 6px; }
    .skill-card p { font-size: 13px; color: var(--text-muted); }
    .delete-btn { position: absolute; top: 14px; right: 14px; background: rgba(239,68,68,0.1); border: none; color: var(--danger); width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 12px; }
    
    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .header-bar { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(22, 30, 49, 0.8); }
    .active-badge { color: var(--primary); font-weight: 700; }
    .api-key-input { background: var(--bg-card); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 260px; }
    
    .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .msg-wrapper { display: flex; width: 100%; flex-direction: column; }
    .msg-wrapper.user { align-items: flex-end; }
    .msg-wrapper.bot { align-items: flex-start; }
    .msg { max-width: 80%; padding: 14px 18px; border-radius: 16px; font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg-wrapper.user .msg { background: var(--user-msg); color: white; border-bottom-right-radius: 4px; }
    .msg-wrapper.bot .msg { background: var(--bot-msg); color: #e2e8f0; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .agent-action { font-size: 12px; color: var(--agent-action); font-family: monospace; background: rgba(4, 120, 87, 0.1); padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; display: inline-block; }
    
    .input-wrapper { padding: 20px 24px; border-top: 1px solid var(--border); }
    .input-bar { display: flex; gap: 12px; background: var(--bg-panel); padding: 8px; border-radius: 16px; border: 1px solid var(--border); }
    .input-bar textarea { flex: 1; background: transparent; border: none; color: white; padding: 12px; resize: none; height: 48px; font-size: 15px; outline: none; }
    .btn-send { background: var(--primary); color: white; border: none; width: 48px; height: 48px; border-radius: 12px; cursor: pointer; flex-shrink: 0; }
    .btn-send:disabled { background: var(--border); cursor: not-allowed; }

    /* Modal Styling disederhanakan untuk contoh */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
    .modal { background: var(--bg-panel); width: 90%; max-width: 400px; padding: 24px; border-radius: 16px; }
    .modal input, .modal textarea { width: 100%; margin-bottom: 12px; padding: 10px; background: var(--bg-main); color: white; border: 1px solid var(--border); border-radius: 8px; }
    .modal button { padding: 10px; width: 100%; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; }
      .sidebar { width: 100%; height: auto; border-bottom: 1px solid var(--border); padding: 16px; }
      .skill-list { flex-direction: row; overflow-x: auto; }
      .skill-card { min-width: 200px; }
      .header-bar { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px 16px; }
      .api-key-input { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header-top">
        <h2>⚡ Koleksi Skill</h2>
        <button class="btn-create" onclick="document.getElementById('modalOverlay').style.display='flex'">+ Baru</button>
      </div>
      <div class="skill-list" id="skillListContainer"></div>
    </aside>

    <main class="main-chat">
      <header class="header-bar">
        <div>Skill Aktif: <span class="active-badge" id="activeSkillLabel"></span></div>
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="Paste Gemini API Key di sini...">
      </header>
      <div class="chat-box" id="chatBox">
        <div class="msg-wrapper bot"><div class="msg">Halo! Saya sekarang adalah AI Agent. Coba tes saya: "Berapa hasil dari 5728 dikali 394?"</div></div>
      </div>
      <footer class="input-wrapper">
        <div class="input-bar">
          <textarea id="promptInput" placeholder="Ketik perintah Anda..."></textarea>
          <button class="btn-send" id="btnSend" onclick="handleSend()">➤</button>
        </div>
      </footer>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 style="color:white; margin-bottom: 15px;">Buat Skill</h3>
      <input type="text" id="skillName" placeholder="Nama Skill">
      <input type="text" id="skillRole" placeholder="Peran AI">
      <textarea id="skillInstructions" rows="4" placeholder="Aturan Kerja"></textarea>
      <button onclick="saveSkill(); document.getElementById('modalOverlay').style.display='none'">Simpan</button>
    </div>
  </div>

  <script>
    const defaultSkill = { id: 'default', name: 'Agent Matematika', role: 'Agent Penghitung', instructions: 'Bantu pengguna. Jika ada perhitungan, SELALU gunakan tool hitung_matematika.' };
    let skills = JSON.parse(localStorage.getItem('agent_skills')) || [defaultSkill];
    let activeSkillId = localStorage.getItem('agent_active_skill') || 'default';
    let chatHistory = []; // Memori Agent

    document.addEventListener('DOMContentLoaded', () => {
      renderSkills();
      const savedKey = localStorage.getItem('agent_gemini_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('apiKeyInput').addEventListener('input', e => localStorage.setItem('agent_gemini_key', e.target.value.trim()));
    });

    function renderSkills() {
      const container = document.getElementById('skillListContainer');
      container.innerHTML = '';
      if(!skills.find(s => s.id === activeSkillId)) activeSkillId = skills[0].id;
      skills.forEach(skill => {
        const card = document.createElement('div');
        card.className = `skill-card ${skill.id === activeSkillId ? 'active' : ''}`;
        card.onclick = () => { activeSkillId = skill.id; localStorage.setItem('agent_active_skill', skill.id); renderSkills(); chatHistory = []; };
        card.innerHTML = `<h4>${skill.name}</h4><p>${skill.role}</p>`;
        container.appendChild(card);
      });
      document.getElementById('activeSkillLabel').innerText = skills.find(s => s.id === activeSkillId).name;
    }

    function saveSkill() {
      skills.push({ id: 'sk_'+Date.now(), name: document.getElementById('skillName').value || 'Skill Baru', role: document.getElementById('skillRole').value, instructions: document.getElementById('skillInstructions').value });
      localStorage.setItem('agent_skills', JSON.stringify(skills)); renderSkills();
    }

    function appendMessage(sender, text, actionText = null) {
      const chatBox = document.getElementById('chatBox');
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${sender}`;
      let innerHTML = '';
      if (actionText) innerHTML += `<div class="agent-action">⚙️ ${actionText}</div>`;
      innerHTML += `<div class="msg">${text}</div>`;
      wrapper.innerHTML = innerHTML;
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return wrapper;
    }

    // --- BAGIAN INTI: DEKLARASI ALAT (TOOLS) ---
    const tools = [{
      functionDeclarations: [{
        name: "hitung_matematika",
        description: "Menghitung operasi matematika secara presisi. Wajib digunakan untuk perhitungan angka.",
        parameters: { type: "OBJECT", properties: { ekspresi: { type: "STRING", description: "Contoh: 5728 * 394" } }, required: ["ekspresi"] }
      }]
    }];

    // --- BAGIAN INTI: EKSEKUSI ALAT LOKAL ---
    function executeLocalTool(name, args) {
      if (name === "hitung_matematika") {
        try { 
          // Evaluasi hitungan matematika menggunakan mesin browser
          return { hasil: eval(args.ekspresi).toString() }; 
        } 
        catch (e) { return { error: "Ekspresi matematika tidak valid." }; }
      }
      return { error: "Alat tidak ditemukan." };
    }

    // --- BAGIAN INTI: AGENTIC LOOP (SOPIR AI) ---
    async function handleSend() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      if (!text || !apiKey) return;

      appendMessage('user', text);
      input.value = '';
      document.getElementById('btnSend').disabled = true;

      // Masukkan pesan user ke memori
      chatHistory.push({ role: 'user', parts: [{ text: text }] });

      const activeSkill = skills.find(s => s.id === activeSkillId);
      let isAgentWorking = true;

      // LOOP AGENT: Terus berjalan sampai AI memutuskan memberi jawaban final teks
      while (isAgentWorking) {
        const statusMsg = document.createElement('div');
        statusMsg.className = 'msg-wrapper bot';
        statusMsg.innerHTML = '<div class="agent-action">⏳ Agent sedang berpikir...</div>';
        document.getElementById('chatBox').appendChild(statusMsg);

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: `PERAN: ${activeSkill.role}\nATURAN: ${activeSkill.instructions}` }] },
              contents: chatHistory,
              tools: tools // Mengirimkan kotak alat ke AI
            })
          });

          const data = await response.json();
          document.getElementById('chatBox').removeChild(statusMsg);
          const replyPart = data.candidates[0].content.parts[0];

          // CEK 1: Apakah AI memutuskan memanggil alat?
          if (replyPart.functionCall) {
            const funcName = replyPart.functionCall.name;
            const funcArgs = replyPart.functionCall.args;
            
            // Tampilkan aksi di layar
            appendMessage('bot', `Menjalankan: ${funcArgs.ekspresi}`, `Memanggil Alat: ${funcName}`);
            
            // Simpan keputusan AI ke memori
            chatHistory.push({ role: 'model', parts: [replyPart] });
            
            // Eksekusi alat secara lokal di browser
            const functionResult = executeLocalTool(funcName, funcArgs);
            
            // Kembalikan hasil eksekusi ke memori AI
            chatHistory.push({
              role: 'user', // Respons fungsi selalu dikirim sebagai 'user'
              parts: [{ functionResponse: { name: funcName, response: functionResult } }]
            });
            // Loop akan berlanjut, mengirim hasil ini kembali ke Gemini
          } 
          // CEK 2: Apakah AI memberikan jawaban teks final?
          else if (replyPart.text) {
            appendMessage('bot', replyPart.text);
            chatHistory.push({ role: 'model', parts: [{ text: replyPart.text }] });
            isAgentWorking = false; // Hentikan loop
          }
        } catch (err) {
          document.getElementById('chatBox').removeChild(statusMsg);
          appendMessage('bot', '❌ Error Sistem Agent: ' + err.message);
          isAgentWorking = false;
        }
      }
      document.getElementById('btnSend').disabled = false;
    }
  </script>
</body>
</html>
